services:
  interview-simulator:
    build: .
    ports:
      - "8501:8501"   # Streamlit UI
      - "3002:3002"   # WebSocket voice server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Persist ChromaDB between restarts (optional)
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
