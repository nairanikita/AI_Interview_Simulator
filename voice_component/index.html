<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: transparent; padding: 10px 14px;
        }
        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: #d1d5db; }
        .dot.listening  { background: #22c55e; animation: pulse 1.4s ease-in-out infinite; }
        .dot.speaking   { background: #3b82f6; animation: pulse 1.4s ease-in-out infinite; }
        .dot.processing { background: #f59e0b; }
        .dot.waiting    { background: #f59e0b; animation: pulse 1.4s ease-in-out infinite; }
        .dot.error      { background: #ef4444; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.35;transform:scale(0.8)} }
        #status-text { font-size: 13px; font-weight: 600; color: #374151; }

        .info-box { border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; display: none; }
        .info-box .label { font-size: 10px; font-weight: 700; text-transform: uppercase;
                           letter-spacing: 0.05em; margin-bottom: 3px; }
        .info-box .body  { font-size: 13px; line-height: 1.4; min-height: 18px; }

        #alex-box { background: #eff6ff; border: 1px solid #93c5fd; }
        #alex-box .label { color: #1d4ed8; }
        #alex-box .body  { color: #1e3a8a; }

        #live-box { background: #f0fdf4; border: 1px solid #86efac; }
        #live-box .label { color: #16a34a; }
        #live-box .body  { color: #166534; }

        /* countdown bar — only shown while waiting for first speech */
        #timer-wrap { display: none; margin-bottom: 6px; }
        #timer-bar-bg { height: 6px; border-radius: 3px; background: #e5e7eb; overflow: hidden; }
        #timer-bar { height: 100%; border-radius: 3px; background: #22c55e;
                     transition: width 1s linear, background 0.4s; }
        #timer-label { font-size: 11px; color: #6b7280; margin-top: 2px; text-align: right; }

        #error-msg { font-size: 12px; color: #ef4444; margin-top: 4px; display: none; }
    </style>
</head>
<body>

<div class="status-row">
    <div class="dot waiting" id="dot"></div>
    <span id="status-text">Connecting…</span>
</div>

<div id="alex-box" class="info-box">
    <div class="label">Alex is saying…</div>
    <div class="body" id="alex-text"></div>
</div>

<div id="timer-wrap">
    <div id="timer-bar-bg"><div id="timer-bar" style="width:100%"></div></div>
    <div id="timer-label">10s</div>
</div>

<div id="live-box" class="info-box">
    <div class="label">Hearing you say…</div>
    <div class="body" id="live-text"></div>
</div>

<div id="error-msg"></div>

<script>
// ── config ────────────────────────────────────────────────────────────────────
var WS_URL          = "ws://127.0.0.1:3002";
var NO_SPEECH_SEC   = 10;    // seconds with NO speech before repeating/skipping
var SPEECH_END_MS   = 5000;  // ms of silence AFTER last word before submitting (user can pause 5s mid-response)

// ── state machine ─────────────────────────────────────────────────────────────
// WAITING    → listening but no speech detected yet → 10 s countdown runs
// RESPONDING → user started speaking → countdown gone, only speech-end timer
// PROCESSING → transcript sent, waiting for Alex's reply
// SPEAKING   → Alex's TTS is playing
var MODE = "SPEAKING"; // start muted until first TTS

// ── vars ──────────────────────────────────────────────────────────────────────
var ws            = null;
var recognition   = null;
var currentAudio  = null;   // track active Audio element so we can stop it
var accumulated   = "";
var speechEndTmr  = null;
var countdownIval = null;
var countdownSec  = 0;
var repeatCount   = 0;
var lastAudioId   = 0;

// ── DOM ───────────────────────────────────────────────────────────────────────
var dot       = document.getElementById("dot");
var statusEl  = document.getElementById("status-text");
var alexBox   = document.getElementById("alex-box");
var alexText  = document.getElementById("alex-text");
var timerWrap = document.getElementById("timer-wrap");
var timerBar  = document.getElementById("timer-bar");
var timerLbl  = document.getElementById("timer-label");
var liveBox   = document.getElementById("live-box");
var liveText  = document.getElementById("live-text");
var errorEl   = document.getElementById("error-msg");

// ── helpers ───────────────────────────────────────────────────────────────────
function setStatus(cls, text) { dot.className = "dot " + cls; statusEl.textContent = text; }
function showAlex(t) { alexBox.style.display = t ? "block" : "none"; alexText.textContent = t || ""; }
function showLive(t) { liveBox.style.display = t ? "block" : "none"; liveText.textContent = t || ""; }

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWs() {
    ws = new WebSocket(WS_URL);
    ws.onopen  = function() { errorEl.style.display = "none"; };
    ws.onmessage = function(ev) {
        var data = JSON.parse(ev.data);
        if (data.type === "audio" && data.audio_id !== lastAudioId && data.b64) {
            lastAudioId = data.audio_id;
            playAudio(data.b64, data.text || "");
        }
    };
    ws.onerror = function() {
        errorEl.style.display = "block";
        errorEl.textContent = "Voice server unreachable — check Streamlit terminal.";
    };
    ws.onclose = function() {
        // Server went away — stop audio and mic immediately
        stopEverything();
        setStatus("waiting", "Disconnected — reconnecting…");
        setTimeout(connectWs, 1000);
    };
}

function sendEvent(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── countdown (WAITING phase only) ───────────────────────────────────────────
function startWaitingCountdown() {
    stopCountdown();
    countdownSec = NO_SPEECH_SEC;
    timerWrap.style.display = "block";
    updateTimer(NO_SPEECH_SEC, NO_SPEECH_SEC);
    countdownIval = setInterval(function() {
        countdownSec--;
        updateTimer(countdownSec, NO_SPEECH_SEC);
        if (countdownSec <= 0) { stopCountdown(); onNoSpeechTimeout(); }
    }, 1000);
}

function stopCountdown() {
    clearInterval(countdownIval); countdownIval = null;
    timerWrap.style.display = "none";
}

function updateTimer(rem, tot) {
    var pct = Math.max(0, rem / tot) * 100;
    timerBar.style.width      = pct + "%";
    timerBar.style.background = pct > 50 ? "#22c55e" : pct > 20 ? "#f59e0b" : "#ef4444";
    timerLbl.textContent      = rem + "s";
}

// Fired when 10 s pass with NO speech at all
function onNoSpeechTimeout() {
    if (MODE !== "WAITING") return;
    accumulated = ""; showLive("");
    if (repeatCount < 1) {
        repeatCount++;
        MODE = "PROCESSING";
        setStatus("processing", "Repeating question…");
        sendEvent({ type: "repeat" });
    } else {
        repeatCount = 0;
        MODE = "PROCESSING";
        setStatus("processing", "Moving on…");
        sendEvent({ type: "timeout" });
    }
}

// ── TTS playback ──────────────────────────────────────────────────────────────
function playAudio(b64, text) {
    MODE = "SPEAKING";
    muteRecognition();
    stopCountdown();
    clearTimeout(speechEndTmr);
    showLive(""); showAlex(text);
    setStatus("speaking", "Alex is speaking…");

    setTimeout(function() {
        currentAudio = new Audio("data:audio/mp3;base64," + b64);
        function onDone() {
            currentAudio = null;
            showAlex("");
            setTimeout(enterWaiting, 1500);
        }
        currentAudio.onerror = onDone;
        currentAudio.onended = onDone;
        currentAudio.play().catch(onDone);
    }, 300);
}

// ── enter WAITING phase (after Alex finishes speaking) ────────────────────────
function enterWaiting() {
    MODE        = "WAITING";
    accumulated = "";
    // Do NOT reset repeatCount here — it must survive across the repeat playback
    // so we know we already repeated once and should move on next timeout.
    showLive("");
    setStatus("listening", "Your turn — speak now…");
    startMic();
    startWaitingCountdown();   // 10 s countdown starts HERE, not before
}

// ── submit transcript after silence ──────────────────────────────────────────
function onSpeechEnd() {
    if (MODE !== "RESPONDING") return;
    var text = accumulated.trim();
    accumulated = ""; showLive("");
    if (!text) {
        // Nothing recognised — restart the waiting phase (keep repeatCount intact)
        enterWaiting();
        return;
    }
    // Successful answer — reset repeat counter for the next question
    repeatCount = 0;
    MODE = "PROCESSING";
    stopCountdown();
    muteRecognition();
    setStatus("processing", "Processing…");
    sendEvent({ type: "transcript", text: text });
}

// ── speech recognition ────────────────────────────────────────────────────────
function startMic() {
    try { recognition.start(); } catch(e) {}
}

function muteRecognition() {
    clearTimeout(speechEndTmr);
    try { recognition.abort(); } catch(e) {}
}

function initRecognition() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        setStatus("error", "Browser unsupported");
        errorEl.style.display = "block";
        errorEl.textContent   = "Speech recognition requires Chrome or Edge.";
        return;
    }
    recognition = new SR();
    recognition.continuous     = true;
    recognition.interimResults = true;
    recognition.lang           = "en-US";

    recognition.onresult = function(event) {
        // Ignore everything while Alex speaks or while transcript is being processed
        if (MODE === "SPEAKING" || MODE === "PROCESSING") return;

        var finalChunk = "", interim = "";
        for (var i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) finalChunk += event.results[i][0].transcript;
            else                          interim    += event.results[i][0].transcript;
        }

        showLive(interim || (accumulated + " " + finalChunk).trim());

        if ((interim || finalChunk) && MODE === "WAITING") {
            // ── First speech detected ──────────────────────────────────────
            // Kill the no-speech countdown — it's no longer relevant.
            // From now on only the speech-end timer controls submission.
            MODE = "RESPONDING";
            stopCountdown();
            setStatus("listening", "Listening… (keep going)");
        }

        if (finalChunk && MODE === "RESPONDING") {
            accumulated += " " + finalChunk;
            // Reset the speech-end timer on every new word
            clearTimeout(speechEndTmr);
            speechEndTmr = setTimeout(onSpeechEnd, SPEECH_END_MS);
        }
    };

    recognition.onerror = function(ev) {
        if (ev.error === "no-speech" || ev.error === "aborted") return;
        if (ev.error === "not-allowed") {
            setStatus("error", "Mic blocked");
            errorEl.style.display = "block";
            errorEl.textContent   = "Microphone access denied — allow it in Chrome settings.";
        }
    };

    recognition.onend = function() {
        // Auto-restart unless we deliberately muted (SPEAKING / PROCESSING)
        if (MODE === "WAITING" || MODE === "RESPONDING") {
            setTimeout(startMic, 200);
        }
    };
}

// ── stop everything (server disconnect / page close) ──────────────────────────
function stopEverything() {
    MODE = "SPEAKING"; // mute — prevents mic from restarting
    clearTimeout(speechEndTmr);
    stopCountdown();
    if (currentAudio) { currentAudio.pause(); currentAudio.src = ""; currentAudio = null; }
    try { recognition.abort(); } catch(e) {}
    showAlex(""); showLive("");
}

// Stop audio and mic when the tab is closed or Streamlit kills the page
window.addEventListener("beforeunload", function() {
    stopEverything();
    if (ws) { ws.onclose = null; ws.close(); }
});

// Also stop when the tab becomes hidden (user switches away)
document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
        if (currentAudio) { currentAudio.pause(); }
        try { recognition.abort(); } catch(e) {}
    }
});

// ── boot ──────────────────────────────────────────────────────────────────────
initRecognition();
connectWs();
// Recognition starts and countdown begins only after Alex's first TTS (enterWaiting)
</script>
</body>
</html>
