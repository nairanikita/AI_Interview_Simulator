<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: transparent;
            padding: 12px 16px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #ccc;
            transition: background 0.3s;
        }
        .dot.listening  { background: #22c55e; animation: pulse 1.4s ease-in-out infinite; }
        .dot.speaking   { background: #3b82f6; animation: pulse 1.4s ease-in-out infinite; }
        .dot.processing { background: #f59e0b; }
        .dot.paused     { background: #a855f7; }
        .dot.error      { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1;   transform: scale(1);    }
            50%       { opacity: 0.4; transform: scale(0.85); }
        }

        #status-text {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }

        #interim {
            margin-top: 6px;
            font-size: 12px;
            color: #9ca3af;
            font-style: italic;
            min-height: 18px;
            padding-left: 21px;
        }

        #not-supported {
            font-size: 13px;
            color: #ef4444;
            display: none;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="dot listening" id="dot"></div>
        <span id="status-text">Listening…</span>
    </div>
    <div id="interim"></div>
    <div id="not-supported"></div>

<script>
    // ── constants ─────────────────────────────────────────────────────────────
    const SILENCE_MS        = 15000;   // 15s of total silence → move on
    const SPEECH_END_MS     = 1500;    // 1.5s quiet after speech → process it
    const PAUSE_EXTENDED_MS = 45000;   // "give me a moment" → extend to 45s

    const REPEAT_PHRASES = [
        "repeat", "say that again", "can you repeat",
        "pardon", "come again", "what did you say", "say it again"
    ];
    const PAUSE_PHRASES = [
        "give me a moment", "let me think", "one moment",
        "hold on", "give me a second", "one second", "just a moment"
    ];

    // ── state ─────────────────────────────────────────────────────────────────
    let recognition       = null;
    let isListening       = false;
    let isMuted           = false;
    let silenceTimer      = null;
    let speechEndTimer    = null;
    let currentSilenceMs  = SILENCE_MS;
    let accumulated       = "";
    let lastAudioB64      = "";

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const dot         = document.getElementById("dot");
    const statusText  = document.getElementById("status-text");
    const interimEl   = document.getElementById("interim");
    const notSupEl    = document.getElementById("not-supported");

    // ── Streamlit protocol ────────────────────────────────────────────────────
    function send(value) {
        window.parent.postMessage({
            type: "streamlit:setComponentValue",
            apiVersion: 1,
            value: value,
        }, "*");
    }

    window.addEventListener("message", function (ev) {
        if (ev.data.type === "streamlit:render") {
            onProps(ev.data.args || {});
        }
    });

    window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
    window.parent.postMessage({ type: "streamlit:setFrameHeight", height: 70  }, "*");

    // ── prop handler ──────────────────────────────────────────────────────────
    function onProps(p) {
        // new audio to play → mute mic, play, then resume
        if (p.audio_b64 && p.audio_b64 !== lastAudioB64) {
            lastAudioB64 = p.audio_b64;
            playAudio(p.audio_b64);
        }
    }

    // ── audio playback ────────────────────────────────────────────────────────
    function playAudio(b64) {
        muteRecognition();
        setStatus("speaking", "Alex is speaking…");

        const audio = new Audio("data:audio/mp3;base64," + b64);
        audio.play().catch(function (e) {
            // autoplay blocked — resume mic anyway
            console.warn("audio play blocked:", e);
            resumeRecognition();
            send({ type: "speaking_done" });
        });

        audio.onended = function () {
            // small gap so the mic doesn't catch the tail of TTS
            setTimeout(function () {
                resumeRecognition();
                send({ type: "speaking_done" });
            }, 600);
        };
    }

    // ── status UI ─────────────────────────────────────────────────────────────
    function setStatus(state, text) {
        dot.className = "dot " + state;
        statusText.textContent = text;
    }

    // ── silence timers ────────────────────────────────────────────────────────
    function resetSilenceTimer() {
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(onSilenceTimeout, currentSilenceMs);
    }

    function onSilenceTimeout() {
        if (isMuted) return;
        accumulated = "";
        interimEl.textContent = "";
        currentSilenceMs = SILENCE_MS;   // reset back to 15s
        send({ type: "timeout" });
        setStatus("processing", "Moving on…");
    }

    // ── transcript processing ─────────────────────────────────────────────────
    function processTranscript() {
        const text = accumulated.trim();
        accumulated = "";
        interimEl.textContent = "";
        if (!text) return;

        clearTimeout(silenceTimer);

        const t = text.toLowerCase();

        if (REPEAT_PHRASES.some(function(p) { return t.includes(p); })) {
            send({ type: "repeat", text: text });
            setStatus("processing", "Repeating question…");
            return;
        }

        if (PAUSE_PHRASES.some(function(p) { return t.includes(p); })) {
            currentSilenceMs = PAUSE_EXTENDED_MS;
            resetSilenceTimer();
            send({ type: "pause", text: text });
            setStatus("paused", "Take your time…");
            return;
        }

        send({ type: "transcript", text: text });
        setStatus("processing", "Processing…");
    }

    // ── speech recognition ────────────────────────────────────────────────────
    function initRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            notSupEl.style.display = "block";
            notSupEl.textContent = "⚠ Speech recognition not supported. Please use Chrome or Edge.";
            setStatus("error", "Unsupported browser");
            return;
        }

        recognition = new SR();
        recognition.continuous     = true;
        recognition.interimResults = true;
        recognition.lang           = "en-US";

        recognition.onstart = function () {
            isListening = true;
            setStatus("listening", "Listening…");
            resetSilenceTimer();
        };

        recognition.onresult = function (event) {
            let finalChunk = "";
            let interim    = "";

            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    finalChunk += event.results[i][0].transcript;
                } else {
                    interim += event.results[i][0].transcript;
                }
            }

            interimEl.textContent = interim;

            if (finalChunk) {
                accumulated += " " + finalChunk;
                resetSilenceTimer();                      // speech → reset 15s timer
                clearTimeout(speechEndTimer);
                speechEndTimer = setTimeout(processTranscript, SPEECH_END_MS);
            }
        };

        recognition.onerror = function (ev) {
            // no-speech and aborted are expected — not real errors
            if (ev.error === "no-speech" || ev.error === "aborted") return;
            console.error("SpeechRecognition error:", ev.error);
        };

        recognition.onend = function () {
            isListening = false;
            // auto-restart unless we deliberately muted it
            if (!isMuted) {
                setTimeout(function () {
                    try { recognition.start(); } catch (e) {}
                }, 250);
            }
        };

        recognition.start();
    }

    function muteRecognition() {
        isMuted     = true;
        isListening = false;
        clearTimeout(silenceTimer);
        clearTimeout(speechEndTimer);
        try { recognition.abort(); } catch (e) {}
    }

    function resumeRecognition() {
        isMuted      = false;
        accumulated  = "";
        interimEl.textContent = "";
        setStatus("listening", "Listening…");
        try { recognition.start(); } catch (e) {}
        resetSilenceTimer();
    }

    // ── boot ──────────────────────────────────────────────────────────────────
    initRecognition();
</script>
</body>
</html>
